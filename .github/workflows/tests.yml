name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      # Actions are pinned to commit SHAs, not tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Tests (no GPU, no model downloads)
        run: uv run pytest -q
      - name: Audit dependencies
        # torch (CUDA index), tribev2 (git) and the spaCy model (URL) are not on
        # PyPI and are skipped; everything else must be free of known CVEs.
        run: uvx --from pip-audit==2.10.1 pip-audit --progress-spinner off --path "$(uv run python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
        shell: bash
