[project]
name = "cortexreel"
version = "0.1.0"
description = "Predict viewer brain response to a video with Meta TRIBE v2 and find the weak moments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.11.*"
dependencies = [
    "tribev2 @ git+https://github.com/facebookresearch/tribev2@af58661791a351a448a489042a28f6c37e1c14b7",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "faster-whisper==1.2.1",
    "imageio-ffmpeg>=0.6",
    "huggingface_hub",
    "nilearn>=0.11",
    "matplotlib>=3.8",
    "pillow>=13",
    # spaCy model neuralset uses to split words into sentences; without it,
    # neuralset pip-installs it at run time (needs network, `uv sync` removes it).
    # A direct URL with its hash: never resolved by name from PyPI.
    "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl#sha256=293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63",
]

[project.scripts]
cortexreel = "cortexreel.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cortexreel"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders with nilearn or other heavy steps (deselect with -m 'not slow')"]

[tool.uv]
# moviepy 2.2.1 (via tribev2) caps pillow<12, but Pillow 11.x has known CVEs
# fixed in 13.0. moviepy only uses basic Image APIs; the test suite and a full
# analyze run pass on Pillow 13. Only applied inside this project (`uv sync`,
# `uv run`): a `uv tool install` must pass `--overrides` itself (see README).
override-dependencies = ["pillow>=13"]
# Cooldown: lock only releases that have been public for a week, so a
# compromised upload has time to be noticed and yanked. Move it forward when relocking.
exclude-newer = "2026-10-21T00:00:00Z"
